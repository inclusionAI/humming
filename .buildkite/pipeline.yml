steps:
  - &b200_tests
    label: "Common Tests (B200)"
    key: humming-b200-ci
    agents:
      queue: b200-k8s
    timeout_in_minutes: 180
    concurrency: 1
    concurrency_group: humming/b200
    command: bash .buildkite/run-tests.sh
    artifact_paths:
      - "test-results/pytest.xml"
    plugins:
      - kubernetes:
          podSpec:
            runtimeClassName: nvidia
            containers:
              # NGC 26.07 multi-arch: PyTorch 2.13 development snapshot and CUDA 13.3.
              - image: nvcr.io/nvidia/pytorch:26.07-py3@sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c
                resources:
                  limits:
                    nvidia.com/gpu: 1
                volumeMounts:
                  - name: devshm
                    mountPath: /dev/shm
            volumes:
              - name: devshm
                emptyDir:
                  medium: Memory

  - &dgx_spark_tests
    label: "Common Tests (DGX Spark)"
    key: humming-dgx-spark-ci
    agents:
      queue: dgx-spark
    timeout_in_minutes: 180
    concurrency: 1
    concurrency_group: humming/dgx-spark
    command: bash .buildkite/run-tests.sh
    artifact_paths:
      - "test-results/pytest.xml"
    plugins:
      - docker#v5.2.0:
          # NGC 26.07 multi-arch: PyTorch 2.13 development snapshot and CUDA 13.3.
          image: nvcr.io/nvidia/pytorch:26.07-py3@sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c
          always-pull: true
          propagate-environment: true
          propagate-uid-gid: true
          gpus: all
          volumes:
            - /dev/shm:/dev/shm

  - <<: *b200_tests
    label: "Batch Invariant Tests (B200)"
    key: humming-b200-batch-invariant-ci
    command: HUMMING_TEST_TUNING_SOURCE=batch_invariant bash .buildkite/run-tests.sh tests/kernels/humming/

  - <<: *dgx_spark_tests
    label: "Batch Invariant Tests (DGX Spark)"
    key: humming-dgx-spark-batch-invariant-ci
    command: HUMMING_TEST_TUNING_SOURCE=batch_invariant bash .buildkite/run-tests.sh tests/kernels/humming/

  - input: "Run Sampled Tests"
    key: approve-sampled-tests

  - <<: *b200_tests
    label: "Sampled Tests (B200)"
    key: humming-b200-sampled-ci
    depends_on: approve-sampled-tests
    command: HUMMING_TEST_TUNING_SOURCE=sampled bash .buildkite/run-tests.sh tests/kernels/humming/

  - <<: *dgx_spark_tests
    label: "Sampled Tests (DGX Spark)"
    key: humming-dgx-spark-sampled-ci
    depends_on: approve-sampled-tests
    command: HUMMING_TEST_TUNING_SOURCE=sampled bash .buildkite/run-tests.sh tests/kernels/humming/
