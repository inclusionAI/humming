<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1272" viewBox="0 0 1480 1272" role="img" aria-labelledby="title desc">
<title id="title">Humming CUDA：共享主循环与可替换实现</title>
<desc id="desc">纵向 CUDA 内核结构图。普通流水线、Warp Specialization 与 UMMA 专用流水线复用适用的组件。中央主干是 Scheduler、G2S 加载、S2R 取数、反量化、Tensor Core 计算、Epilogue 与输出。G2S 到 MMA 圈为沿 K 迭代的主循环。左右细线是模板实现分支而非额外 kernel 启动：任务调度支持 Dense/MoE 和 Stream-K/Raster；访存支持普通加载、cp.async 和 TMA；反量化由数据类型、scale、zero point 描述并选择通用、原生或融合路径；MMA 后端有 MMA、WGMMA、UMMA、MXMMA；输出可融合缩放、bias、归约与写回。Ctx 与 if constexpr 在编译期组合各实现，各功能按设备、dtype 和配置支持条件启用。箭头表示逻辑阶段，实际共享内存、寄存器与 Tensor Memory 路径随后端变化。</desc>

