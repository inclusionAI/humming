<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1104" viewBox="0 0 1400 1104" role="img" aria-labelledby="title desc" lang="en" xml:lang="en">
<title id="title">Humming: From Standard Format to JIT Inference</title>
<desc id="desc">Preprocessing validates configurations, pads dimensions, and repacks weights. Layer Config, Tuning Config, and Compute Config are shown side by side and jointly feed JIT compilation. Layer Config describes the weight shape, data types, and quantization. Compute Config specifies GEMM type, batch invariance, and input scale layout. Tuning Config uses a two-column, two-row grid for tiling, pipelining, memory access, and MMA instructions including UMMA. Preprocessed weights enter inference from the left and runtime activations enter from the right.</desc>
<!-- Sources:
 humming/layer.py: HummingLayer.transform; humming/transform.py:
 prepare_layer_config, transform_humming_tensors.
 humming/kernel/humming.py: _resolve_configs, prepare_kernels, init_kernel.
 humming/tune/__init__.py: get_heuristics_config.
 humming/config/config.py: TuningConfig fields summarized in the central panel:
 block_shape, warp_shape, num_stages, use_warp_spec, use_tma,
 use_cp_async, num_ctas_per_sm, use_stream_k.
 humming/jit/runtime.py: _get_compiler, prepare, load_cubin.
 humming/jit/compiler.py: NVRTCCompiler, NVCCCompiler, Compiler.compile.
 humming/forward.py and humming/ops/gemm.py: runtime input processing and dispatch.
 Preprocessed tensor values are inference inputs, not compiler inputs.
 Compilation and tensor preparation are reusable for subsequent inference calls.
-->
