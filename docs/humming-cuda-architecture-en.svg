<title id="title">Humming CUDA: Shared Mainloop and Pluggable Implementations</title>
<desc id="desc">A vertical CUDA kernel structure. Standard, warp-specialized and dedicated UMMA pipelines reuse compatible components. The central flow shows scheduling, G2S transfers, S2R loads, dequantization and scaling, Tensor Core computation, the epilogue and output. Side branches show task mapping, memory access, numeric processing, architecture backends and fused output.</desc>

