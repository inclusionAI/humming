<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1212" viewBox="0 0 1400 1212" role="img" aria-labelledby="title desc">
<title id="title">Humming：统一量化表示与自由参数组合</title>
<desc id="desc">不同来源的量化方法与存储格式经格式解析、参数映射和张量转换，汇入 Humming 标准格式。标准格式包含通用量化参数和标准化张量。权重数值格式、缩放粒度及分组大小、scale 类型、zero point、二级 scale 可组合，并与激活数据类型及静态或动态量化策略组合。三组配置仅展示标准表示的不同实例，不表示加载时自动改变量化方案。组合须满足数据类型与设备支持条件。统一表示随后用于 Humming 的 Dense 和 MoE 推理。</desc>
<!-- Source: humming/schema/{__init__,base,humming,awq,gptq,modelopt,mxfp4}.py;
     humming/config/enum.py; humming/dtypes.py; humming/transform.py.
     The central representation is HummingWeightSchema + HummingInputSchema
     with normalized tensors, before architecture-specific kernel packing.
     Weight fields: b_dtype, bs_dtype, weight_scale_type,
     weight_scale_group_size, weight_scale_group_size_n,
     has_zero_point, is_fp_zero_point, weight_scale_2_type.
     Input fields: a_dtype, input_scale_dtype, input_quant_mode,
     input_scale_group_size.
     Options describe composability subject to compatibility checks;
     they are not an unrestricted Cartesian product.
-->
